# Конфигурация эксперимента. Все параметры протокола (PROTOCOL.md) задаются здесь,
# код берёт их только отсюда. Пометка «⚑» — решение ждёт подтверждения (задача 0.5).

project:
  name: cryptonews
  protocol_version: "0.1-draft"

paths:
  data_dir: data          # переопределяется переменной окружения CRYPTONEWS_DATA_DIR (например, папка на Google Drive)
  results_dir: results    # переопределяется переменной окружения CRYPTONEWS_RESULTS_DIR

time:
  timezone: UTC
  frequency: 1h
  # Границы выборки вычисляет код по правилам PROTOCOL.md (раздел 2) и пишет в
  # results/metrics/sample_period.json; null — «по правилу», дата — принудительно.
  sample_start: null      # первые полные сутки UTC, когда доступны все источники
  sample_end: null        # самая ранняя из границ: час после последней свечи; начало месяца, в котором прекращается регулярный сбор основного источника новостей
  coverage:
    min_source_share: 0.05  # основной источник — не меньше 5% новостей набора за последние recent_months месяцев
    recent_months: 12
    window_days: 7          # темп сбора — среднее число новостей в день в окне 7 суток с центром в этом дне
    min_ratio: 0.5          # сбор регулярный, пока темп не ниже половины обычного
    reference_days: 365     # обычный темп — медиана за последний год набора

data:
  prices:
    source: binance_spot
    archive_base_url: "https://data.binance.vision/data/spot/monthly/klines"
    verify_checksums: true
    symbols: [BTCUSDT, ETHUSDT]
    interval: 1h
    history_start: "2017-08-17"     # начало истории пар BTCUSDT и ETHUSDT на Binance
    history_end: "2026-08"          # последний скачиваемый месяц: фиксирован, чтобы результат не зависел от даты запуска
  news_en:
    dataset: CryptoVision
    doi: "10.17632/3c3xtxtfb6"
    version: 2                      # версия от 07.11.2025, 14 колонок (URL, Title, Date_Time, Coin_Type, …)
    declared_records: 188430        # число записей по описанию авторов — для проверки, та ли версия скачана
    keep_columns: [url, title, date_time, coin_type]   # имена приводятся к единому виду кодом
    source_timezone: null           # null — определить сверкой цен с Binance (задача 3.4); число — сдвиг от UTC в минутах
  news_ru:
    sites: [forklog.com]   # решение 1.5 от 01.10.2026; bits.media отложен (см. PROTOCOL.md, раздел 12)
    snapshot_date: "2026-10-01"     # дата сбора ForkLog; снимок метаданных архивируется вместе с кодом
    source_timezone: UTC            # интерфейс ForkLog отдаёт date_gmt — время уже в UTC
    request_interval_sec: 1.0       # не чаще одного запроса в секунду
    # Привязка к монетам задаётся регулярными выражениями в src/cryptonews/data/coins.py:
    # BTCUSDT — биткоин, биткойн, Bitcoin (кроме Cash, SV, Gold), BTC;
    # ETHUSDT — эфириум, эфир (кроме «в эфире»), Ethereum (кроме Classic), Ether, ETH.
    market_wide_rule: both_assets   # ⚑ общерыночные новости учитываются для обоих активов
  dedup:
    window_hours: 24
    keep: earliest
  time_precision:
    shared_timestamp_min_records: 10   # столько материалов одного источника с одной секундой — время загрузки архива; в признаки не идут

sentiment:
  score: p_pos_minus_p_neg      # s = P(позитив) − P(негатив); класс — с максимальной вероятностью
  text: title                   # модели видят только заголовок
  # Кандидаты для каждого языка. В признаки идёт тот, у кого наибольший macro-F1
  # на ручной разметке первого разметчика (шаг 5b); при равенстве — первый по списку.
  # revision — хеш коммита на Hugging Face (зафиксированы 02.10.2026 по первому запуску шага 5).
  # labels — соответствие классов, если названия в настройках модели ошибочны (по номеру класса).
  candidates:
    en:
      - model: ProsusAI/finbert                       # финансовые новости (Financial PhraseBank)
        revision: 4556d13015211d73dccd3fdd39d39232506f3e43
      - model: burakutf/finetuned-finbert-crypto      # FinBERT, дообученный на криптотекстах
        revision: 24ca955d09a693342a25e6a22249346431cd778c
        # в config.json модели классы названы Neutral/Positive/Negative, а в README автора
        # label_map = {0: negative, 1: neutral, 2: positive}; README подтверждают проверочные фразы
        labels: {0: negative, 1: neutral, 2: positive}
      - model: ElKulako/cryptobert                    # криптовалютные соцсети (StockTwits); Bearish/Bullish
        revision: 9e37c910fe87727cb842a9ac55c6388256fe0f15
    ru:
      - model: blanchefort/rubert-base-cased-sentiment          # соцсети и отзывы
        revision: 2d4b5fc431489a87ca4e44b842d904058706e8d4
      - model: seara/rubert-base-cased-russian-sentiment        # в обучении есть новости
        revision: d09619927897994a405b7a087b2bb04c5921e3f7
      - model: mxlcw/rubert-tiny2-russian-financial-sentiment   # финансовые посты Telegram
        revision: a02913e44597582218db7821d52dc15c331bf427
  selection:
    metric: macro_f1
    bootstrap_reps: 2000
  batch_size: 64
  max_length: 128
  annotation:
    sample_size_per_language: 400
    second_annotator_sample: 100
    seed: 2026

features:
  price:
    return_lags: [1, 2, 3, 4, 5, 6]
    realized_vol_windows: [6, 24]
    volume_change: true
  news:
    languages: [en, ru]
    rolling_window: 6
    trend_window: 3
    sentiment_lag: 1
    no_news_fill: 0.0
    intensity_window_hours: 168     # интенсивность потока: ln(1+N_t) − ln(1+среднее N за предыдущие 168 ч) вместо сырого N_t
    asset_rule: coin_or_market_wide # новость идёт активу, если упоминает его или не упоминает ни BTC, ни ETH
  feature_sets:
    P: [price]
    P_EN: [price, en]
    P_RU: [price, ru]
    P_EN_RU: [price, en, ru]

validation:
  scheme: expanding_walk_forward
  test_months: 24                 # ⚑
  fold_months: 3                  # ⚑ переобучение раз в квартал
  tuning_window_months: 3         # окно выбора гиперпараметров перед тестом
  embargo_hours: 1                # цель строки t известна в t + 2 ч: последняя строка перед фолдом в обучение не идёт
  early_stopping_fraction: 0.1

seeds:
  default: [0, 1, 2, 3, 4]        # Random Forest, XGBoost
  lstm: [0, 1, 2]

models:
  naive_zero: {}
  naive_mean: {}
  arima:
    p: [0, 1, 2, 3]
    q: [0, 1, 2, 3]
    d: 0
    criterion: aic
  arimax:
    order_from: arima
    exog_feature_sets: [P_EN, P_RU, P_EN_RU]   # экзогенные — только новостные признаки
  random_forest:
    n_estimators: [300]
    max_depth: [5, 10, null]
    min_samples_leaf: [50, 200]
    max_features: [sqrt, 0.5]
  xgboost:
    n_estimators: 1000
    early_stopping_rounds: 50
    learning_rate: [0.01, 0.05]
    max_depth: [3, 5]
    min_child_weight: [10, 50]
    subsample: [0.8]
    colsample_bytree: [0.8]
    reg_lambda: [1.0]
  lstm:
    framework: pytorch            # ⚑
    lookback: [12, 24]
    hidden_size: [32, 64]         # второй слой вдвое меньше первого
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 256
    max_epochs: 50
    patience: 5
    scale_target: true

evaluation:
  metrics: [rmse, mae, directional_accuracy, r2_oos]
  dm_test: {loss: squared, hac: newey_west, alpha: 0.05, multiple_testing: holm}
  pt_test: {alpha: 0.05}
  mcs: {alpha: 0.10, loss: squared, bootstrap_reps: 1000}
  strategy:
    primary: long_flat            # ⚑
    secondary: long_short
    costs_bp: [0, 5, 10, 20]
    primary_cost_bp: 10           # ⚑ базовая комиссия спотового рынка Binance
    annualization_hours: 8760
    benchmark: buy_and_hold
  bootstrap:
    method: stationary
    mean_block_hours: 24
    reps: 2000
  selection:
    primary_metric: sharpe_net
    cost_bp: 10
    require_significance: true

diagnostics:
  max_abs_hourly_return: 0.50     # простая доходность за час; больше — ошибка данных, расчёт останавливается
  report_abs_hourly_return: 0.15  # часы с движением больше этого выводятся в отчёт для проверки по другому активу
  shift_test_hours: [1, 2, 3, 24]
  placebo_permutations: 20
