[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptonews"
version = "1.0.0"
description = "Воспроизводимый протокол сравнения моделей прогнозирования криптовалют с учётом новостного фона"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
